name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # weekly dependency audit (Mondays 05:17 UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel superseded PR runs only; never cancel runs on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-type:
    name: lint-type
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/cpu.lock.txt
      - name: Install locked environment (same tool versions as local)
        run: |
          python -m pip install -r requirements/cpu.lock.txt
          python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m mypy

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/cpu.lock.txt
      - name: Install locked environment
        run: |
          python -m pip install -r requirements/cpu.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Unit tests (synthetic fixtures only; no corpus download)
        run: python -m pytest -m "not requires_corpus"

  # Separate, non-required check: a newly published CVE should be visible
  # without blocking unrelated PRs (DEC-006).
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/cpu.lock.txt
      - run: python -m pip install -r requirements/cpu.lock.txt
      - run: python -m pip_audit --progress-spinner off
