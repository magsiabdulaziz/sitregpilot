name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: lint-type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.17.3" "mypy==2.4.1"
      - run: ruff check .
      - run: mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/cpu.lock.txt
      - name: Install locked environment
        run: |
          python -m pip install -r requirements/cpu.lock.txt
          python -m pip install --no-deps -e .
      - name: Unit tests (synthetic fixtures only; no corpus download)
        run: python -m pytest -m "not requires_corpus"
      - name: Dependency vulnerability audit
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip_audit --skip-editable --progress-spinner off
