# CPU lexical baselines B0-B2 for T1 (issue #20; methodology section 7; D-09). Fit on controlled train,
# select on controlled dev. The test set is sealed: no test inference in Phase 3.
task: T1                      # 8 main registers, multilabel (D-03: observed mains, no closure)
cohort: functional            # OTHER-only and empty documents excluded (D-04)
window_words: 1000            # D-06
lexical:
  unicode: NFKC
  lowercase: true
  mask_urls_emails: true      # -> " URLTOKEN " / " EMAILTOKEN "
  token_pattern: "(?u)\\b\\w\\w+\\b"   # scikit-learn default, recorded explicitly
tfidf_grid:                   # D-09
  max_features: [50000, 200000]
  ngram_range: [[1, 1], [1, 2]]
  min_df: 3
logreg_grid:
  C: [0.1, 1.0, 10.0]
  class_weight: [null, balanced]
svm_grid:
  C: [0.1, 1.0, 10.0]
  class_weight: [null, balanced]
thresholds:
  probability_grid: {start: 0.05, stop: 0.95, step: 0.05}
  margin_quantiles: {start: 0.05, stop: 0.95, step: 0.05}   # quantiles of all dev margins
  per_label_min_dev_positives: 50
  per_label_shrinkage: 0.5    # per-label threshold moved halfway back toward the global one
selection_metric: macro_f1
seed: 20261105
n_jobs: 4
